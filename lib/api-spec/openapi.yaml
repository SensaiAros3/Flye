openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Flye - Social Fitness Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User profile operations
  - name: posts
    description: Social feed posts
  - name: leaderboard
    description: Leaderboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Sign up a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current logged in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      summary: Get social feed posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a workout post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePostResponse"
        "400":
          description: Invalid post data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{postId}/workout:
    post:
      operationId: logWorkout
      tags: [posts]
      summary: Log a workout from a post (gain XP)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: XP gained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's public profile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users by XP
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AuthRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 6
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        message:
          type: string
      required:
        - user
        - message

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        xp:
          type: integer
        rank:
          type: string
          enum: [D, C, B, A, S]
        rankLabel:
          type: string
        xpForNextRank:
          type: integer
        xpProgress:
          type: number
        totalWorkouts:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - xp
        - rank
        - rankLabel
        - xpForNextRank
        - xpProgress
        - totalWorkouts
        - createdAt

    WorkoutType:
      type: string
      enum:
        - calisthenics
        - gym
        - power

    CreatePostRequest:
      type: object
      properties:
        workoutType:
          $ref: "#/components/schemas/WorkoutType"
        description:
          type: string
          minLength: 5
          maxLength: 500
        location:
          type: string
          maxLength: 100
      required:
        - workoutType
        - description

    Post:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        userRank:
          type: string
        workoutType:
          $ref: "#/components/schemas/WorkoutType"
        description:
          type: string
        xpEarned:
          type: integer
        location:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - username
        - userRank
        - workoutType
        - description
        - xpEarned
        - createdAt

    CreatePostResponse:
      type: object
      properties:
        post:
          $ref: "#/components/schemas/Post"
        xpGained:
          type: integer
        leveledUp:
          type: boolean
        newRank:
          type: string
          nullable: true
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - post
        - xpGained
        - leveledUp
        - user

    WorkoutResponse:
      type: object
      properties:
        xpGained:
          type: integer
        leveledUp:
          type: boolean
        newRank:
          type: string
          nullable: true
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - xpGained
        - leveledUp
        - user

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: integer
        username:
          type: string
        userRank:
          type: string
        xp:
          type: integer
        totalWorkouts:
          type: integer
      required:
        - rank
        - userId
        - username
        - userRank
        - xp
        - totalWorkouts
